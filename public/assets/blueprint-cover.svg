  </g>
  <circle cx="300" cy="330" r="4" fill="#E4C989"/>

  <text x="300" y="520" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" letter-spacing="6" fill="#A39A8B">FREE BLUEPRINT</text>

  <text x="300" y="580" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="600" fill="url(#goldText)">The Faceless</text>
  <text x="300" y="628" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="600" fill="url(#goldText)">YouTube Profit</text>
  <text x="300" y="676" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="600" fill="url(#goldText)">Blueprint</text>

  <line x1="240" y1="712" x2="360" y2="712" stroke="#C8A25C" stroke-opacity="0.4"/>
  <text x="300" y="742" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" letter-spacing="2" fill="#6E6659">HIDDEN PROFIT WITH AUSTIN</text>
